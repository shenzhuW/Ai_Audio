</style></head><body><div id="app"></div><script>
const PAGES=[['create','创建视频','✚'],['overview','项目总览','▣'],['research','研究资料','⌕'],['script','口播文稿','▤'],['voice','配音时间轴','◉'],['storyboard','分镜与素材','▦'],['assets','资产管理','▧'],['motion','AI 动画制作','⌘'],['review','成片预览','▶'],['export','导出成片','⇧']];

const projectLine=`<div class="row"><img src="${IM('gpu')}" style="width:56px;height:56px;object-fit:cover;border-radius:10px"><div class="flex1"><div class="strong" style="font-size:16px">为什么 AI 大模型需要大量 GPU？</div><div style="margin-top:7px">${tag('科技科普')}&nbsp; ${tag('02:00 自定义时长','off')}&nbsp; ${tag('9:16 竖屏','off')}&nbsp; ${tag('v3 草稿','off')}</div></div></div>`;

function makeCreate(){return head('01 / 10','创建视频','从主题、文稿或已有资料出发。视频时长由用户自由设置。',B('保存草稿')+B('创建项目 →','primary'))+`<div class="split"><div class="stack">${card(`<div class="padlg"><div class="title">描述你的视频创意</div>${lab('视频主题 / 创作要求')}<textarea class="textbox" style="height:126px">制作一条关于「为什么 AI 大模型需要大量 GPU」的科技科普视频。先研究可靠资料，再生成口播与分镜。结合真实授权的视频素材，用程序化动画解释并行计算、模型训练与数据中心。</textarea><div class="cols2 mt12"><div>${lab('视频标题')}<input class="input" value="为什么 AI 大模型需要大量 GPU？"></div><div>${lab('目标受众')}<select class="input"><option>科技爱好者 / 普通观众</option></select></div></div><div class="cols3 mt12"><div>${lab('自定义时长')}<div class="row"><input class="input" value="2" style="width:64px;text-align:center">分 <input class="input" value="00" style="width:64px;text-align:center"> 秒</div></div><div>${lab('视频画幅')}<select class="input"><option>9:16 · 竖屏</option><option>16:9 · 横屏</option></select></div><div>${lab('内容语言')}<select class="input"><option>简体中文</option></select></div></div></div>`) + card(`<div class="padlg"><div class="title">选择创作起点</div><div class="cols3"><div class="option selected"><span class="radio"></span><div><b>从主题开始</b><div class="caption">AI 研究 → 文稿 → 视频</div></div></div><div class="option"><span class="radio"></span><div><b>已有口播文稿</b><div class="caption">跳过研究，直接制作</div></div></div><div class="option"><span class="radio"></span><div><b>从资料开始</b><div class="caption">上传资料形成研究上下文</div></div></div></div><div class="line"></div><div class="row spread"><div><b>参考资料与素材</b><div class="caption">支持 PDF / DOCX / 图片 / MP4 / URL</div></div>${B('＋ 添加资料','soft')}</div><div class="audit mt12">研究阶段可使用公开视频辅助理解，但未经确认使用权的素材不会自动进入正式视频。</div></div>`)}</div><div class="stack">${card(`<div class="padlg"><div class="title">视觉方向</div><div class="cols2"><img class="img" style="height:128px" src="${IM('server')}"><img class="img" style="height:128px" src="${IM('data_stream')}"></div><p class="caption">科技解释风：深蓝背景、真实影像、清晰数据图表、程序化标注。</p><div>${tag('科技纪录片')}&nbsp;${tag('高级动态图形')}&nbsp;${tag('字幕清晰')}</di
